events {}
http {
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;
    upstream inventario { zone inventario 64k; server inventario:8000 resolve; }
    server {
        listen 8000;
        location / { proxy_pass http://inventario; proxy_read_timeout 5s; proxy_connect_timeout 1s; }
    }
}
