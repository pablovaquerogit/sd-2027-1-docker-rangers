events {}
http {
    resolver 127.0.0.11 valid=1s ipv6=off;
    resolver_timeout 2s;
    upstream usuarios { zone usuarios 64k; server usuarios:8000 resolve; }
    upstream inventario { zone inventario 64k; server inventario:8000 resolve; }
    upstream pedidos { zone pedidos 64k; server pedidos:8000 resolve; }
    server {
        listen 8000;
        proxy_set_header X-Internal-Key "";
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_read_timeout 20s;
        proxy_connect_timeout 2s;
        location ~ ^/api/(usuarios|sesiones)(/|$) { proxy_pass http://usuarios; }
        location ~ ^/api/productos(/|$) { proxy_pass http://inventario; }
        location ~ ^/api/pedidos(/|$) { proxy_pass http://pedidos; }
        location = /health { proxy_pass http://pedidos; }
        location / { return 404; }
    }
}
